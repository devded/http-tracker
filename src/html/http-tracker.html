<!DOCTYPE html>
<html id="http_tracker" lang="en">

<head>
  <meta charset="utf-8" />
  <title>HTTP TRACKER PLUS</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="/src/js/tailwindcss.min.js"></script>
  <link rel="stylesheet" type="text/css" href="/src/css/styles.css" />
  <script type="text/javascript" src="/src/js/httpTrackerConstants.js"></script>
  <script type="text/javascript" src="/src/js/httpTrackerHelpers.js"></script>
  <script type="text/javascript" src="/src/js/httpTrackerUtils.js"></script>
  <script type="text/javascript" src="/src/js/httpTrackerProcessor.js"></script>
  <script type="text/javascript" src="/src/js/httpTrackerDebugger.js"></script>
  <script type="text/javascript" src="/src/js/httpTrackerFilterResponse.js"></script>
  <script type="text/javascript" src="/src/js/httpTrackerDNR.js"></script>
  <script type="text/javascript" src="/src/js/httpTrackerDomEvents.js"></script>
  <script type="text/javascript" src="/src/js/httpTrackerOpen.js"></script>
  <script type="text/javascript" src="/src/js/uiInteractions.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .mono {
      font-family: 'Fira Code', monospace;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .tab-active {
      border-bottom: 2px solid #3b82f6;
      color: white;
    }

    /* Input Toggle Styles since v2 CDN doesn't support peer-checked well in some older browsers, ensuring it works */
    .toggle-checkbox:checked {
      right: 0;
      border-color: #68D391;
    }

    .toggle-checkbox:checked+.toggle-label {
      background-color: #68D391;
    }
  </style>
</head>

<body class="bg-gray-900 text-gray-200 h-screen flex flex-col overflow-hidden">
  <!-- Top Navigation Bar -->
  <header class="h-14 border-b border-gray-800 flex items-center justify-between px-6 bg-gray-900 z-20">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z"
            clip-rule="evenodd" />
        </svg>
      </div>
      <h1 class="text-lg font-bold tracking-tight text-white">HTTP TRACKER PLUS</h1>
    </div>

    <div class="flex items-center space-x-2">
      <button id="toggle_track_web_events"
        class="px-4 py-1.5 rounded-full bg-gray-800 hover:bg-gray-700 text-sm font-medium transition-all duration-200 flex items-center space-x-2 border border-gray-700">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        <span>Tracking</span>
      </button>
      <button id="delete_all_web_events"
        class="p-1.5 rounded-lg hover:bg-red-900 text-gray-400 hover:text-red-400 transition-colors"
        title="Clear all events">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
            clip-rule="evenodd" />
        </svg>
      </button>
      <button id="theme_toggle" class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 transition-colors"
        title="Toggle Light/Dark Mode">
        <svg id="sun_icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 20 20"
          fill="currentColor">
          <path fill-rule="evenodd"
            d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
            clip-rule="evenodd" />
        </svg>
        <svg id="moon_icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
        </svg>
      </button>
      <button id="preferences" class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-400 transition-colors"
        title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.532 1.532 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.532 1.532 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"
            clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content Toolbar -->
  <div class="bg-gray-900 border-b border-gray-800 p-3 space-y-3">
    <div class="flex flex-wrap items-center gap-4">
      <!-- Filter Controls -->
      <div class="flex items-center bg-gray-800 rounded-lg border border-gray-700 divide-x divide-gray-700">
        <select id="web_event_filter_key"
          class="bg-transparent text-sm py-1.5 pl-3 pr-8 outline-none text-gray-400 hover:text-white transition-colors cursor-pointer">
          <option value="0">STATUS</option>
          <option value="1">METHOD</option>
          <option value="2" selected>URL</option>
          <option value="3">DATE</option>
        </select>
        <div class="flex items-center px-3 min-w-[300px]">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500 mr-2" viewBox="0 0 20 20"
            fill="currentColor">
            <path fill-rule="evenodd"
              d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
              clip-rule="evenodd" />
          </svg>
          <input id="filter_web_events" type="text" placeholder="Filter requests..."
            class="bg-transparent text-sm py-1 outline-none w-full text-gray-200 placeholder-gray-500" />
          <button id="clear_filter_web_events" class="text-gray-500 hover:text-gray-300 ml-2" title="Clear filter">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Quick Toggles -->
      <div class="flex items-center space-x-6 text-xs font-medium text-gray-400">
        <label class="flex items-center space-x-2 cursor-pointer group">
          <input id="include_form_data" type="checkbox" checked
            class="form-checkbox h-4 w-4 text-blue-600 rounded border-gray-600 bg-gray-800" />
          <span class="group-hover:text-gray-200">Request Body</span>
        </label>

        <label class="flex items-center space-x-2 cursor-pointer group">
          <input id="include_response_body" type="checkbox"
            class="form-checkbox h-4 w-4 text-blue-600 rounded border-gray-600 bg-gray-800" />
          <span class="group-hover:text-gray-200">Response Body</span>
        </label>

        <label class="flex items-center space-x-2 cursor-pointer group">
          <input id="optimize_response_cookies" type="checkbox" checked
            class="form-checkbox h-4 w-4 text-blue-600 rounded border-gray-600 bg-gray-800" />
          <span class="group-hover:text-gray-200">Optimize Cookies</span>
        </label>
      </div>
    </div>

    <!-- Pattern Filters -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <div class="relative flex items-center">
        <span
          class="absolute left-3 z-10 w-14 text-[10px] font-bold text-blue-500 uppercase tracking-wider pointer-events-none">Track</span>
        <input id="track_urls_pattern" type="text" placeholder="URL patterns to include..."
          class="bg-gray-800 border border-gray-700 rounded-lg py-3.5 pl-20 pr-3 text-sm w-full focus:border-blue-500 outline-none transition-all placeholder-gray-600" />
      </div>
      <div class="relative flex items-center">
        <span
          class="absolute left-3 z-10 w-14 text-[10px] font-bold text-yellow-500 uppercase tracking-wider pointer-events-none">Skip</span>
        <input id="exclude_urls_pattern" type="text" placeholder="URL patterns to ignore..."
          class="bg-gray-800 border border-gray-700 rounded-lg py-3.5 pl-20 pr-3 text-sm w-full focus:border-yellow-500 outline-none transition-all placeholder-gray-600" />
      </div>
      <div class="relative flex items-center">
        <span
          class="absolute left-3 z-10 w-14 text-[10px] font-bold text-red-500 uppercase tracking-wider pointer-events-none">Block</span>
        <input id="block_urls_pattern" type="text" placeholder="URL patterns to block..."
          class="bg-gray-800 border border-gray-700 rounded-lg py-3.5 pl-20 pr-3 text-sm w-full focus:border-red-500 outline-none transition-all placeholder-gray-600" />
      </div>
    </div>
  </div>

  <!-- Main Grid Area -->
  <main class="flex-grow flex overflow-hidden">
    <!-- Events List Panel -->
    <div class="w-1/2 flex flex-col border-r border-gray-800 h-full">
      <div
        class="bg-gray-900 px-4 py-2.5 text-[10px] font-bold text-gray-500 uppercase flex items-center border-b border-gray-800">
        <div class="w-16 text-center flex-shrink-0">Status</div>
        <div class="w-16 text-center flex-shrink-0 ml-2">Method</div>
        <div class="flex-grow min-w-0 px-3">URL</div>
        <div class="w-20 text-right flex-shrink-0">Time</div>
      </div>
      <div id="urls_list" class="flex-grow overflow-y-auto custom-scrollbar divide-y divide-gray-800" tabindex="0">
        <!-- Events will be populated here -->
      </div>
    </div>

    <!-- Details Panel -->
    <div class="w-1/2 flex flex-col h-full bg-gray-900">
      <div id="web_details_selected_container"
        class="flex flex-col h-full invisible opacity-0 transition-opacity duration-200 hidden">
        <!-- Tabs -->
        <div class="flex border-b border-gray-800 bg-gray-900 h-10 px-4 items-center space-x-2" id="details_tabs">
          <button data-target="panel_request"
            class="details-tab-btn px-4 py-2 text-xs font-semibold text-white border-b-2 border-blue-500 hover:text-white transition-all active">Request</button>
          <button data-target="panel_response"
            class="details-tab-btn px-4 py-2 text-xs font-semibold text-gray-400 border-b-2 border-transparent hover:text-white transition-all">Response</button>
        </div>

        <!-- Detail Panels (Single Column) -->
        <div class="flex-grow overflow-y-auto custom-scrollbar bg-gray-900 relative">

          <!-- Request Panel -->
          <div id="panel_request" class="details-tab-content p-5 space-y-4">
            <div id="request_headers_details" class="details-content">
              <!-- Request content populated by JS -->
            </div>
          </div>

          <!-- Response Panel -->
          <div id="panel_response" class="details-tab-content p-5 space-y-4 hidden">
            <div id="response_headers_details" class="details-content">
              <!-- Response content populated by JS -->
            </div>
          </div>

        </div>

        <!-- Detail Footer -->
        <div class="h-10 border-t border-gray-800 bg-gray-900 flex items-center justify-between px-4 text-xs">
          <button id="delete_selected_web_event" class="text-gray-500 hover:text-red-400 flex items-center space-x-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                clip-rule="evenodd" />
            </svg>
            <span>Delete Entry</span>
          </button>
          <div class="relative flex items-center min-w-[200px]">
            <input id="find_in_details_pattern" type="text" placeholder="Search in details..."
              class="bg-gray-800 border border-gray-700 rounded py-1 px-3 text-[11px] w-full outline-none focus:border-gray-600 transition-all font-medium" />
            <!-- Hidden compatibility elements -->
            <div style="display:none">
              <div id="add_modify_headers"></div>
              <div id="add_modify_headers_banner"></div>
              <div id="enable_mask_patterns"></div>
              <div id="mask_patterns_list"></div>
              <div id="delete_cookies"></div>
              <div id="delete_cookies_button"></div>
              <div id="delete_all_filtered_web_events"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty State -->
      <div id="details_empty_state" class="flex-grow flex flex-col items-center justify-center text-gray-600 space-y-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 opacity-20" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
        </svg>
        <p class="text-sm font-medium">Select a request to view details</p>
      </div>
    </div>
  </main>
</body>

</html>
